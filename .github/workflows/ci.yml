name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-vscode:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @vscode/vsce
      - run: vsce package
        working-directory: vscode/monokai

  build-jetbrains:
    name: Build JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - run: chmod +x gradlew && ./gradlew buildPlugin
        working-directory: jetbrains/monokai
