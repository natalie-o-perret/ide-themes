name: cd - release

on:
  push:
    branches: [main]

jobs:
  tag:
    name: tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: bump version and tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

  build-vscode:
    name: build vscode extension
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install -g @vscode/vsce
      - run: vsce package
        working-directory: vscode/monokai
      - uses: actions/upload-artifact@v5
        with:
          name: vscode-vsix
          path: vscode/monokai/*.vsix

  build-jetbrains:
    name: build jetbrains plugin
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - run: chmod +x gradlew && ./gradlew buildPlugin
        working-directory: jetbrains/monokai
      - uses: actions/upload-artifact@v5
        with:
          name: jetbrains-zip
          path: jetbrains/monokai/build/distributions/*.zip

  github-release:
    name: create github release
    needs: [tag, build-vscode, build-jetbrains]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          artifacts: "vscode-vsix/*.vsix,jetbrains-zip/*.zip"

  publish-vscode:
    name: publish to open vsx
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install -g ovsx @vscode/vsce
      - run: vsce package && ovsx publish *.vsix -p ${{ secrets.OVSX_TOKEN }}
        working-directory: vscode/monokai

  publish-jetbrains:
    name: publish to jetbrains marketplace
    needs: github-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - run: chmod +x gradlew && ./gradlew publishPlugin
        working-directory: jetbrains/monokai
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
