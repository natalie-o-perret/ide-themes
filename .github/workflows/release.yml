name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-vscode:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @vscode/vsce
      - run: vsce package
        working-directory: vscode/monokai
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: vscode/monokai/*.vsix

  build-jetbrains:
    name: Build JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: chmod +x gradlew && ./gradlew buildPlugin
        working-directory: jetbrains/monokai
      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains-zip
          path: jetbrains/monokai/build/distributions/*.zip

  release:
    name: Create GitHub release
    needs: [build-vscode, build-jetbrains]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vscode-vsix/*.vsix
            jetbrains-zip/*.zip

  publish-vscode:
    name: Publish to VS Code Marketplace
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @vscode/vsce
      - run: vsce publish -p ${{ secrets.VSCE_PAT }}
        working-directory: vscode/monokai

  publish-jetbrains:
    name: Publish to JetBrains Marketplace
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: chmod +x gradlew && ./gradlew publishPlugin
        working-directory: jetbrains/monokai
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
